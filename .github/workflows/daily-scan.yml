name: Daily ad transparency scan

# Midday US Eastern. GitHub cron is UTC only, so both offsets are scheduled
# and the guard step runs exactly one of them: 16:03 UTC is noon in EDT,
# 17:03 UTC is noon in EST. It keys on which cron fired, not on the clock,
# because GitHub often starts scheduled runs late and a clock check would
# then skip the day.
on:
  schedule:
    - cron: '3 16 * * *'
    - cron: '3 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print Slack messages, post nothing, save nothing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick the noon run for the current Eastern offset
        id: guard
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          if [ -z "$FIRED" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=America/New_York date +%z)   # -0400 or -0500
          if { [ "$offset" = "-0400" ] && [ "$FIRED" = "3 16 * * *" ]; } || \
             { [ "$offset" = "-0500" ] && [ "$FIRED" = "3 17 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not noon Eastern for this offset ($offset); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        if: steps.guard.outputs.run == 'true'
        run: npm test

      - name: Scan and alert
        if: steps.guard.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_DIRECTMEDS: ${{ secrets.SLACK_CHANNEL_DIRECTMEDS }}
          SLACK_ERROR_CHANNEL: ${{ secrets.SLACK_ERROR_CHANNEL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run scan -- ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep screenshots and reports
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: ignore

      # The seen-advertiser history is what makes "NEW" mean new. Committed
      # so it survives between runs and its history is readable in git.
      - name: Save state
        if: success() && steps.guard.outputs.run == 'true' && !inputs.dry_run
        run: |
          git config user.name "ad-transparency-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "State: daily scan $(date -u +%F)"
          git push
